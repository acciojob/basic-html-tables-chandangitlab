<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Roll number</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Mahesh Kumar</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Chandan Kumar</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
